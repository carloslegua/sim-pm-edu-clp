<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Riesgos — PMBOK y AACE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* ===== Paleta UTEC: cian vivo + negro, sobre base clara ===== */
    --bg-0:#eef4f9;
    --bg-1:#ffffff;
    --bg-2:#f3f8fc;
    --grid-line: rgba(0,175,232,0.07);
    --panel: #ffffff;
    --panel-border: #e0e8f0;
    --ink-0:#1a2027;
    --ink-1:#4d5768;
    --ink-2:#5b6472;

    --cyan:#00b6ec;
    --cyan-dark:#0090c2;
    --cyan-dim: rgba(0,182,236,0.13);
    --black:#1a1a1c;
    --black-dim: rgba(26,26,28,0.08);

    /* categorías de interesados */
    --cat-int:#00b6ec;   /* Interno */
    --cat-cli:#00c2a8;   /* Cliente / Usuario */
    --cat-reg:#2e4374;   /* Regulador / Estado */
    --cat-com:#ff9f1c;   /* Comunidad */
    --cat-prov:#6c5ce7;  /* Proveedor / Contratista */
    --cat-fin:#ff6b8b;   /* Financiero */

    --danger:#ff5470;
    --good:#00c2a8;
    --warn:#ff9f1c;
    --radius: 10px;
    --mono: 'JetBrains Mono', monospace;
    --display: 'Manrope', sans-serif;
    --body: 'Manrope', 'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle, rgba(0,182,236,0.06) 1px, transparent 1px) 0 0/26px 26px,
      var(--bg-0);
    color:var(--ink-0);
    font-family:var(--body);
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  /* ===== HEADER ===== */
  header{
    border-bottom:1px solid var(--panel-border);
    background:linear-gradient(180deg, #ffffff, #fbfdff);
    padding:12px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    position:relative;
  }
  header::after{
    content:'';
    position:absolute; left:0; right:0; bottom:-1px; height:3px;
    background:linear-gradient(90deg, var(--cyan), var(--cat-prov) 45%, var(--cat-com) 75%, var(--cat-fin));
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .logo{
    width:34px;height:34px;border-radius:9px;flex-shrink:0;
    background:linear-gradient(135deg, var(--cyan), var(--cyan-dark));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,182,236,0.35);
  }
  .brand h1{
    font-family:var(--display);
    font-size:19px;
    font-weight:800;
    margin:0;
    letter-spacing:0.1px;
    color:var(--black);
  }
  .brand .tag{
    font-family:var(--mono);
    font-size:11px;
    font-weight:600;
    color:#fff;
    border:none;
    background:linear-gradient(135deg, var(--cyan), var(--cyan-dark));
    padding:3px 9px;
    border-radius:20px;
    letter-spacing:0.5px;
  }
  .brand .sub{font-size:12px;color:var(--ink-2); font-weight:500;}

  .project-title-input{
    background:transparent;
    border:none;
    border-bottom:1px dashed transparent;
    color:var(--ink-0);
    font-family:var(--display);
    font-weight:600;
    font-size:13px;
    padding:2px 0;
    max-width:280px;
  }
  .project-title-input:hover, .project-title-input:focus{
    border-bottom:1px dashed var(--cyan);
    outline:none;
  }
  .course-title-input{
    background:transparent;
    border:none;
    border-bottom:1px dashed transparent;
    color:var(--ink-2);
    font-family:var(--body);
    font-weight:600;
    font-size:12px;
    text-align:right;
    padding:2px 0;
    min-width:220px;
    max-width:320px;
  }
  .course-title-input:hover, .course-title-input:focus{
    border-bottom:1px dashed var(--cyan);
    outline:none;
    color:var(--ink-0);
  }

  /* ===== TOOLBAR ===== */
  .toolbar{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    align-items:center;
    padding:10px 22px;
    background:var(--bg-1);
    border-bottom:1px solid var(--panel-border);
    box-shadow: 0 1px 0 rgba(20,30,60,0.02);
  }
  .btn{
    font-family:var(--body);
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-1);
    background:var(--bg-2);
    border:1px solid var(--panel-border);
    padding:7px 13px;
    border-radius:8px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    transition:border-color .12s, color .12s, background .12s, transform .08s, box-shadow .12s;
    white-space:nowrap;
  }
  .btn:hover{border-color:var(--cyan); color:var(--cyan-dark); background:#fff; box-shadow:0 2px 6px rgba(0,182,236,0.15);}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:linear-gradient(135deg, var(--cyan), var(--cyan-dark)); border-color:transparent; color:#fff; box-shadow:0 2px 8px rgba(0,182,236,0.35);}
  .btn.primary:hover{filter:brightness(1.06); color:#fff; box-shadow:0 3px 10px rgba(0,182,236,0.45);}
  .btn.danger{color:var(--danger);}
  .btn.danger:hover{border-color:var(--danger); color:var(--danger); box-shadow:0 2px 6px rgba(255,84,112,0.18);}
  .btn:disabled{opacity:0.35; cursor:not-allowed;}
  .sep{width:1px; height:22px; background:var(--panel-border); margin:0 4px;}

  .toggle-group{display:flex; border:1px solid var(--panel-border); border-radius:8px; overflow:hidden;}
  .toggle-group .btn{border:none; border-radius:0; background:var(--bg-1);}
  .toggle-group .btn.active{background:var(--black); color:#fff;}
  .toggle-group .btn.active:hover{color:#fff;}

  input[type=file]{display:none;}

  /* ===== LAYOUT ===== */
  .workspace{flex:1; display:flex; min-height:0;}
  .main-area{
    flex:1;
    overflow:auto;
    position:relative;
    padding:26px 30px 60px;
  }
  .view-head{margin-bottom:16px;}
  .view-head h2{
    font-family:var(--display); font-size:20px; font-weight:800; color:var(--ink-0);
    margin:0 0 4px;
  }
  .view-head p{font-size:13px; color:var(--ink-1); margin:0; max-width:720px; line-height:1.55;}

  /* ===== SVG chart shell ===== */
  .chart-wrap{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:14px;
    padding:14px; box-shadow:0 2px 12px rgba(20,30,60,0.05);
    display:inline-block; max-width:100%;
  }
  svg.chart{display:block; max-width:100%; height:auto;}

  .bubble{cursor:pointer; transition:opacity .12s;}
  .bubble circle{transition:stroke-width .1s, r .1s;}
  .bubble:hover circle{stroke-width:3;}
  .bubble.selected circle{stroke:#1a1a1c; stroke-width:3.5;}
  .bubble text{font-family:var(--mono); font-size:10px; font-weight:700; fill:#fff; pointer-events:none;}
  .bubble.dim{opacity:0.25;}

  .quad-label{font-family:var(--display); font-weight:800; font-size:13px; letter-spacing:0.3px;}
  .quad-sub{font-family:var(--body); font-weight:600; font-size:10.5px;}
  .axis-label{font-family:var(--display); font-weight:800; font-size:13px; fill:var(--ink-1); letter-spacing:0.4px;}
  .axis-tick{font-family:var(--mono); font-size:9.5px; fill:var(--ink-2);}
  .venn-label{font-family:var(--display); font-weight:800; font-size:15px; letter-spacing:0.3px;}
  .region-name{font-family:var(--mono); font-size:9px; font-weight:700; fill:var(--ink-2); text-transform:uppercase; letter-spacing:0.4px;}

  /* ===== SIDEBAR ===== */
  .sidebar{
    width:310px;
    flex-shrink:0;
    background:var(--panel);
    border-left:1px solid var(--panel-border);
    overflow-y:auto;
    padding:18px 18px 40px;
  }
  .sidebar h3{
    font-family:var(--display); font-size:13px; font-weight:800;
    color:var(--ink-0); margin:0 0 14px;
    display:flex; align-items:center; gap:8px;
  }
  .sidebar h3::before{content:''; width:4px; height:14px; background:linear-gradient(180deg, var(--cyan), var(--cat-prov)); display:inline-block; border-radius:3px;}
  .sidebar h3.mt{margin-top:22px;}
  .field{margin-bottom:12px;}
  .field label{
    display:block; font-size:10.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.5px; color:var(--ink-2); margin-bottom:5px;
  }
  .field input, .field textarea, .field select{
    width:100%; background:var(--bg-2); border:1.5px solid var(--panel-border);
    border-radius:8px; color:var(--ink-0); padding:7px 9px; font-family:var(--body);
    font-size:13px;
  }
  .field input:focus, .field textarea:focus, .field select:focus{outline:none; border-color:var(--cyan); background:#fff;}
  .field textarea{resize:vertical; min-height:48px;}
  .field-row{display:flex; gap:8px;}
  .field-row .field{flex:1;}

  .slider-field{margin-bottom:10px;}
  .slider-field .lab{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:3px;}
  .slider-field .lab label{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-2); margin:0;}
  .slider-field .lab .val{font-family:var(--mono); font-size:12px; font-weight:700; color:var(--cyan-dark);}
  .slider-field input[type=range]{width:100%; accent-color:var(--cyan); margin:0;}

  .empty-hint{color:var(--ink-2); font-size:12.5px; line-height:1.6; padding:8px 0;}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px;}
  .stat{
    background:linear-gradient(145deg, var(--bg-2), #fff); border:1.5px solid var(--panel-border); border-radius:10px;
    padding:10px 11px;
  }
  .stat .v{font-family:var(--mono); font-size:17px; font-weight:800; color:var(--cyan-dark);}
  .stat .l{font-size:9.5px; color:var(--ink-2); font-weight:600; text-transform:uppercase; letter-spacing:0.4px; margin-top:2px;}

  .legend{display:flex; flex-direction:column; gap:6px; margin-bottom:16px;}
  .legend-item{display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--ink-1); font-weight:500;}
  .legend-dot{width:11px;height:11px;border-radius:50%; flex-shrink:0;}

  .tip-box{
    background:var(--cyan-dim); border:1px solid rgba(0,182,236,0.25);
    border-radius:9px; padding:10px 12px; font-size:11.5px; color:var(--ink-1);
    line-height:1.55; margin-bottom:10px;
  }
  .tip-box b{color:var(--cyan-dark);}
  .strat-box{
    border:1.5px solid var(--panel-border); border-radius:10px; padding:10px 12px; margin-bottom:8px;
    font-size:12px; color:var(--ink-1); line-height:1.5;
    background:#fff;
  }
  .strat-box .st{font-family:var(--display); font-weight:800; font-size:12.5px; color:var(--ink-0); margin-bottom:2px; display:flex; align-items:center; gap:7px;}
  .strat-box .st .d{width:11px;height:11px;border-radius:3px;}
  .danger-zone{margin-top:16px; padding-top:14px; border-top:1px dashed var(--panel-border);}


  /* ===== FOOTER STATUS ===== */
  .statusbar{
    border-top:1px solid var(--panel-border);
    background:var(--bg-1);
    padding:7px 22px;
    font-size:11px;
    color:var(--ink-2);
    display:flex; justify-content:space-between;
    font-family:var(--mono);
  }

  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg-0);}
  ::-webkit-scrollbar-thumb{background:#c7d3de; border-radius:5px; border:2px solid var(--bg-0);}
  ::-webkit-scrollbar-thumb:hover{background:var(--cyan);}


  /* ===== REPORTE IMPRIMIBLE (📄) ===== */
  #gpiReport{display:none; font-family:var(--body); color:#1a2027; font-size:11.5px; line-height:1.5; background:#fff;}
  @media print{
    body.report-mode{display:block; background:#fff !important;}
    body.report-mode > *:not(#gpiReport){display:none !important;}
    body.report-mode #gpiReport{display:block !important;}
  }
  #gpiReport .rep-head{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; border-bottom:3px solid #00b6ec; padding-bottom:10px; margin-bottom:14px;}
  #gpiReport .rep-head h1{font-family:var(--display); font-size:19px; margin:0 0 3px; font-weight:800; color:#1a1a1c;}
  #gpiReport .rep-head .sub{font-size:11.5px; color:#4d5768; font-weight:600;}
  #gpiReport .rep-meta{font-family:var(--mono); font-size:10px; color:#4d5768; text-align:right; white-space:nowrap; line-height:1.7;}
  #gpiReport h2{font-family:var(--display); font-size:13px; font-weight:800; margin:16px 0 6px; padding-bottom:3px; border-bottom:1px solid #e0e8f0; break-after:avoid;}
  #gpiReport table{width:100%; border-collapse:collapse; margin:6px 0 10px; font-size:10.5px;}
  #gpiReport th{background:#f3f8fc; text-align:left; font-weight:700; padding:5px 7px; border:1px solid #d5dee8;}
  #gpiReport td{padding:4px 7px; border:1px solid #d5dee8; vertical-align:top;}
  #gpiReport tr{break-inside:avoid;}
  #gpiReport table.rep-kv td:first-child{width:30%; background:#f8fbfe; font-weight:700;}
  #gpiReport ul{margin:4px 0 10px; padding-left:18px;}
  #gpiReport li{margin:2px 0;}
  #gpiReport p{margin:4px 0 10px;}
  #gpiReport .rep-note{color:#4d5768; font-size:10px; margin:2px 0 8px;}
  #gpiReport .num{font-family:var(--mono);}
  #gpiReport .rep-sign{display:grid; grid-template-columns:1fr 1fr; gap:40px; margin-top:46px;}
  #gpiReport .rep-sign .box{border-top:1.5px solid #1a2027; padding-top:6px; font-size:10.5px; text-align:center; color:#1a2027;}
  #gpiReport .rep-sign .box .r{color:#5b6472; font-size:9.5px;}
  @page{margin:15mm 13mm;}

  @media print{
    header .tag, .toolbar,.sidebar,.statusbar{display:none !important;}
    body{background:#fff !important;}
    .main-area{overflow:visible;}
    .chart-wrap{box-shadow:none; border:1px solid #ccc;}
  }


  /* ===== REGISTRO DE RIESGOS ===== */
  .muted{color:var(--ink-2);} .small{font-size:11.5px;} .mono{font-family:var(--mono);} .c{text-align:center;} .num{text-align:right; font-family:var(--mono);}
  .banner{display:none; background:#fff3d6; border-bottom:1px solid #ffd58a; color:#6b4a00; padding:9px 22px; font-size:12.5px;}
  .banner.show{display:block;}
  .reg-toolbar{display:flex; gap:8px; margin:0 0 12px; flex-wrap:wrap;}
  .rk-wrap{overflow-x:auto; background:var(--panel); border:1px solid var(--panel-border); border-radius:14px;}
  table.rk{border-collapse:collapse; width:100%; min-width:980px; font-size:12px;}
  table.rk th{font-family:var(--mono); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-2); text-align:center; padding:9px 8px; border-bottom:1px solid var(--panel-border); background:#fbfdfe; white-space:nowrap;}
  table.rk th.l{text-align:left;}
  table.rk td{padding:9px 8px; border-bottom:1px solid var(--panel-border); vertical-align:top; color:var(--ink-0);}
  tr.rk-row{cursor:pointer;} tr.rk-row:hover td{background:#f6fbfe;} tr.rk-row.open td{background:#eef8fd;} tr.rk-row.sel td:first-child{box-shadow:inset 3px 0 0 var(--cyan);}
  tr.rk-row:focus-visible{outline:2px solid var(--cyan); outline-offset:-2px;}
  tr.rk-det > td{padding:0; background:#fbfdfe;}
  .rk-title{font-weight:700; font-size:12.5px;}
  .rk-sub{font-size:11px; color:var(--ink-2); margin-top:2px;}
  .typ{font-family:var(--mono); font-size:9.5px; font-weight:800; padding:1px 6px; border-radius:5px; letter-spacing:.03em;}
  .typ-amenaza{background:rgba(255,84,112,.13); color:#a3172f;} .typ-oportunidad{background:rgba(0,146,194,.14); color:#00546f;}
  .lv{display:inline-block; font-family:var(--mono); font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:999px; white-space:nowrap;}
  .lv-alto{background:rgba(255,84,112,.16); color:#a3172f;} .lv-medio{background:rgba(255,159,28,.2); color:#8a5300;} .lv-bajo{background:rgba(0,194,168,.16); color:#00675a;}
  .lv-none{background:#eef1f4; color:var(--ink-2);}
  .lv.opp.lv-alto{background:rgba(0,146,194,.24); color:#00465e;} .lv.opp.lv-medio{background:rgba(0,182,236,.16); color:#00546f;} .lv.opp.lv-bajo{background:rgba(0,182,236,.08); color:#33667a;}
  .st{font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px; background:#eef4f9; color:var(--ink-1); white-space:nowrap;}
  .st-materializado{background:rgba(255,84,112,.15); color:#a3172f;} .st-cerrado{background:#e8ecef; color:var(--ink-2);} .st-con_respuesta{background:rgba(0,194,168,.15); color:#00675a;}
  .fbadge{display:inline-block; min-width:22px; font-family:var(--mono); font-size:11px; font-weight:800; padding:2px 6px; border-radius:999px;}
  .fbadge.riesgo{background:rgba(255,84,112,.18); color:#a3172f;} .fbadge.aviso{background:rgba(255,159,28,.22); color:#8a5300;}
  .det-box{padding:14px 18px 18px;}
  .det-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px 16px;}
  @media(max-width:1100px){.det-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:720px){.det-grid{grid-template-columns:1fr;}}
  .det-grid .sec{grid-column:1/-1; font-family:var(--mono); font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--cyan-dark); border-bottom:1px solid var(--panel-border); padding:12px 0 4px; margin-top:4px;}
  .fd{min-width:0;} .fd.wide{grid-column:1/-1;}
  .fd > label{display:block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-2); margin-bottom:3px;}
  .fd .hint{font-size:11px; color:var(--ink-2); margin-top:3px; line-height:1.4;}
  .ri{width:100%; font-family:var(--body); font-size:12.5px; padding:6px 8px; border:1px solid var(--panel-border); border-radius:7px; background:#fff; color:var(--ink-0);}
  .ri:focus, .pi:focus{outline:none; border-color:var(--cyan); box-shadow:0 0 0 3px var(--cyan-dim);}
  textarea.ri{resize:vertical; min-height:44px;}
  .r3{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;} .r3 label{font-size:10px; font-weight:600; color:var(--ink-2); text-transform:none; letter-spacing:0;} .r3 label span{display:block; margin-bottom:2px;}
  .rv{display:flex; gap:6px;} .rv .btn.sm{white-space:nowrap; padding:4px 9px; font-size:11.5px;}
  .stmt{background:#eef8fd; border:1px dashed var(--cyan); border-radius:9px; padding:9px 12px; font-size:12.5px; line-height:1.55; color:var(--ink-0);}
  .calc{background:#fff; border:1px solid var(--panel-border); border-radius:10px; padding:12px 14px;}
  .calc-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;} @media(max-width:1100px){.calc-grid{grid-template-columns:repeat(2,1fr);}}
  .cl{font-family:var(--mono); font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-2);} .cv{margin:3px 0; font-size:14px; font-weight:800;}
  .rk-finds{list-style:none; margin:5px 0 0; padding:0; font-size:11.5px; color:var(--ink-1);} .rk-finds li{margin-top:3px; line-height:1.45;}
  .rk-finds .sv{font-family:var(--mono); font-weight:800; font-size:10px; margin-right:6px;}
  .sv.riesgo{color:#a3172f;} .sv.aviso{color:#8a5300;} .sv.info{color:var(--ink-2);}
  .lk{background:none; border:none; padding:0; font-family:var(--mono); font-weight:800; color:var(--cyan-dark); cursor:pointer; text-decoration:underline;}
  /* matriz P×I */
  .mx-toggle{display:flex; gap:14px; align-items:center; margin:0 0 12px; flex-wrap:wrap;}
  .mx-pair{display:grid; grid-template-columns:1fr 1fr; gap:22px;} @media(max-width:1250px){.mx-pair{grid-template-columns:1fr;}}
  .mxh{font-family:var(--display); font-size:14px; font-weight:800; margin:0 0 8px; color:var(--ink-0);}
  table.mx{border-collapse:separate; border-spacing:3px; width:100%; table-layout:fixed;}
  table.mx th{font-size:10.5px; font-weight:700; color:var(--ink-2); padding:4px; text-align:center;}
  table.mx th[scope=row]{text-align:right; padding-right:8px; white-space:nowrap;} table.mx th[scope=row] span{display:block; font-family:var(--mono); font-size:9.5px; font-weight:500;}
  table.mx th.corner{font-size:9.5px; text-align:left;}
