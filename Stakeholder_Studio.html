<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stakeholder Studio — Análisis de Interesados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* ===== Paleta UTEC: cian vivo + negro, sobre base clara ===== */
    --bg-0:#eef4f9;
    --bg-1:#ffffff;
    --bg-2:#f3f8fc;
    --grid-line: rgba(0,175,232,0.07);
    --panel: #ffffff;
    --panel-border: #e0e8f0;
    --ink-0:#1a2027;
    --ink-1:#4d5768;
    --ink-2:#5b6472;

    --cyan:#00b6ec;
    --cyan-dark:#0090c2;
    --cyan-dim: rgba(0,182,236,0.13);
    --black:#1a1a1c;
    --black-dim: rgba(26,26,28,0.08);

    /* categorías de interesados */
    --cat-int:#00b6ec;   /* Interno */
    --cat-cli:#00c2a8;   /* Cliente / Usuario */
    --cat-reg:#2e4374;   /* Regulador / Estado */
    --cat-com:#ff9f1c;   /* Comunidad */
    --cat-prov:#6c5ce7;  /* Proveedor / Contratista */
    --cat-fin:#ff6b8b;   /* Financiero */

    --danger:#ff5470;
    --good:#00c2a8;
    --warn:#ff9f1c;
    --radius: 10px;
    --mono: 'JetBrains Mono', monospace;
    --display: 'Manrope', sans-serif;
    --body: 'Manrope', 'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle, rgba(0,182,236,0.06) 1px, transparent 1px) 0 0/26px 26px,
      var(--bg-0);
    color:var(--ink-0);
    font-family:var(--body);
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  /* ===== HEADER ===== */
  header{
    border-bottom:1px solid var(--panel-border);
    background:linear-gradient(180deg, #ffffff, #fbfdff);
    padding:12px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    position:relative;
  }
  header::after{
    content:'';
    position:absolute; left:0; right:0; bottom:-1px; height:3px;
    background:linear-gradient(90deg, var(--cyan), var(--cat-prov) 45%, var(--cat-com) 75%, var(--cat-fin));
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .logo{
    width:34px;height:34px;border-radius:9px;flex-shrink:0;
    background:linear-gradient(135deg, var(--cyan), var(--cyan-dark));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,182,236,0.35);
  }
  .brand h1{
    font-family:var(--display);
    font-size:19px;
    font-weight:800;
    margin:0;
    letter-spacing:0.1px;
    color:var(--black);
  }
  .brand .tag{
    font-family:var(--mono);
    font-size:11px;
    font-weight:600;
    color:#fff;
    border:none;
    background:linear-gradient(135deg, var(--cyan), var(--cyan-dark));
    padding:3px 9px;
    border-radius:20px;
    letter-spacing:0.5px;
  }
  .brand .sub{font-size:12px;color:var(--ink-2); font-weight:500;}

  .project-title-input{
    background:transparent;
    border:none;
    border-bottom:1px dashed transparent;
    color:var(--ink-0);
    font-family:var(--display);
    font-weight:600;
    font-size:13px;
    padding:2px 0;
    max-width:280px;
  }
  .project-title-input:hover, .project-title-input:focus{
    border-bottom:1px dashed var(--cyan);
    outline:none;
  }
  .course-title-input{
    background:transparent;
    border:none;
    border-bottom:1px dashed transparent;
    color:var(--ink-2);
    font-family:var(--body);
    font-weight:600;
    font-size:12px;
    text-align:right;
    padding:2px 0;
    min-width:220px;
    max-width:320px;
  }
  .course-title-input:hover, .course-title-input:focus{
    border-bottom:1px dashed var(--cyan);
    outline:none;
    color:var(--ink-0);
  }

  /* ===== TOOLBAR ===== */
  .toolbar{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    align-items:center;
    padding:10px 22px;
    background:var(--bg-1);
    border-bottom:1px solid var(--panel-border);
    box-shadow: 0 1px 0 rgba(20,30,60,0.02);
  }
  .btn{
    font-family:var(--body);
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-1);
    background:var(--bg-2);
    border:1px solid var(--panel-border);
    padding:7px 13px;
    border-radius:8px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    transition:border-color .12s, color .12s, background .12s, transform .08s, box-shadow .12s;
    white-space:nowrap;
  }
  .btn:hover{border-color:var(--cyan); color:var(--cyan-dark); background:#fff; box-shadow:0 2px 6px rgba(0,182,236,0.15);}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:linear-gradient(135deg, var(--cyan), var(--cyan-dark)); border-color:transparent; color:#fff; box-shadow:0 2px 8px rgba(0,182,236,0.35);}
  .btn.primary:hover{filter:brightness(1.06); color:#fff; box-shadow:0 3px 10px rgba(0,182,236,0.45);}
  .btn.danger{color:var(--danger);}
  .btn.danger:hover{border-color:var(--danger); color:var(--danger); box-shadow:0 2px 6px rgba(255,84,112,0.18);}
  .btn:disabled{opacity:0.35; cursor:not-allowed;}
  .sep{width:1px; height:22px; background:var(--panel-border); margin:0 4px;}

  .toggle-group{display:flex; border:1px solid var(--panel-border); border-radius:8px; overflow:hidden;}
  .toggle-group .btn{border:none; border-radius:0; background:var(--bg-1);}
  .toggle-group .btn.active{background:var(--black); color:#fff;}
  .toggle-group .btn.active:hover{color:#fff;}

  input[type=file]{display:none;}

  /* ===== LAYOUT ===== */
  .workspace{flex:1; display:flex; min-height:0;}
  .main-area{
    flex:1;
    overflow:auto;
    position:relative;
    padding:26px 30px 60px;
  }
  .view-head{margin-bottom:16px;}
  .view-head h2{
    font-family:var(--display); font-size:20px; font-weight:800; color:var(--ink-0);
    margin:0 0 4px;
  }
  .view-head p{font-size:13px; color:var(--ink-1); margin:0; max-width:720px; line-height:1.55;}

  /* ===== SVG chart shell ===== */
  .chart-wrap{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:14px;
    padding:14px; box-shadow:0 2px 12px rgba(20,30,60,0.05);
    display:inline-block; max-width:100%;
  }
  svg.chart{display:block; max-width:100%; height:auto;}

  .bubble{cursor:pointer; transition:opacity .12s;}
  .bubble circle{transition:stroke-width .1s, r .1s;}
  .bubble:hover circle{stroke-width:3;}
  .bubble.selected circle{stroke:#1a1a1c; stroke-width:3.5;}
  .bubble text{font-family:var(--mono); font-size:10px; font-weight:700; fill:#fff; pointer-events:none;}
  .bubble.dim{opacity:0.25;}

  .quad-label{font-family:var(--display); font-weight:800; font-size:13px; letter-spacing:0.3px;}
  .quad-sub{font-family:var(--body); font-weight:600; font-size:10.5px;}
  .axis-label{font-family:var(--display); font-weight:800; font-size:13px; fill:var(--ink-1); letter-spacing:0.4px;}
  .axis-tick{font-family:var(--mono); font-size:9.5px; fill:var(--ink-2);}
  .venn-label{font-family:var(--display); font-weight:800; font-size:15px; letter-spacing:0.3px;}
  .region-name{font-family:var(--mono); font-size:9px; font-weight:700; fill:var(--ink-2); text-transform:uppercase; letter-spacing:0.4px;}

  /* ===== REGISTER (acordeón de tarjetas) ===== */
  .sh-name{font-family:var(--display); font-weight:700; color:var(--ink-0);}
  .sh-org{font-size:11px; color:var(--ink-2);}
  .cat-chip{
    font-family:var(--mono); font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px;
    color:#fff; white-space:nowrap;
  }
  .num{font-family:var(--mono); font-size:11px; font-weight:600; color:var(--ink-1);}

  .reg-toolbar{display:flex; gap:6px; margin-bottom:12px;}
  .reg-list{display:flex; flex-direction:column; gap:8px;}
  .reg-card{
    background:#fff; border:1px solid var(--panel-border); border-radius:11px;
    box-shadow:0 1px 4px rgba(20,30,60,0.04); overflow:hidden;
    transition:box-shadow .14s, border-color .14s;
  }
  .reg-card:hover{border-color:#cfe0ec;}
  .reg-card.expanded{border-color:var(--cyan); box-shadow:0 5px 20px rgba(0,182,236,0.13);}
  .reg-header{
    display:grid;
    grid-template-columns: minmax(230px,2.2fr) minmax(150px,1.05fr) minmax(130px,0.85fr);
    align-items:center; gap:16px; padding:11px 14px; cursor:pointer;
    transition:background .12s;
  }
  .reg-header:hover{background:var(--bg-2);}
  .reg-card.expanded .reg-header{background:var(--cyan-dim);}
  .reg-headmain{display:flex; align-items:center; gap:11px; min-width:0;}
  .reg-toggle{
    width:23px; height:23px; flex-shrink:0; border-radius:6px; border:1.5px solid var(--panel-border);
    background:#fff; color:var(--ink-1); font-size:11px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-family:var(--mono); line-height:1;
    transition:border-color .12s, background .12s, color .12s;
  }
  .reg-toggle:hover{border-color:var(--cyan); color:var(--cyan-dark);}
  .reg-card.expanded .reg-toggle{background:var(--cyan); border-color:var(--cyan); color:#fff;}
  .reg-namewrap{min-width:0;}
  .reg-namewrap .sh-name{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:13.5px;}
  .reg-namewrap .sh-org{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .reg-headcat{display:flex; flex-direction:column; gap:4px; align-items:flex-start; min-width:0;}
  .reg-quick{display:flex; gap:18px; justify-content:flex-end;}
  .reg-quick .q{text-align:right; line-height:1.1;}
  .reg-quick .ql{display:block; font-size:8.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-2); font-weight:700; margin-bottom:1px;}
  .reg-quick b{font-family:var(--mono); font-size:15px; font-weight:800; color:var(--cyan-dark);}

  .reg-detail-inner{
    padding:4px 16px 16px; border-top:1px dashed var(--panel-border);
    background:linear-gradient(180deg, var(--bg-2), #ffffff);
  }
  .detail-cols{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px 14px; margin:12px 0;}
  .detail-sliders{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(185px, 1fr)); gap:2px 20px;
    margin:6px 0 4px; padding:12px 16px; background:#fff; border:1px solid var(--panel-border); border-radius:9px;
  }
  .detail-foot{display:flex; justify-content:space-between; align-items:center; margin-top:14px; gap:10px; flex-wrap:wrap;}
  .sal-badge{font-family:var(--mono); font-size:11px; font-weight:700; padding:5px 12px; border-radius:20px; color:#fff; letter-spacing:0.2px;}
  .input-map-note{
    background:var(--cyan-dim); border:1px solid rgba(0,182,236,0.25);
    border-radius:9px; padding:9px 12px; font-size:11.5px; color:var(--ink-1);
    line-height:1.55; margin:4px 0 10px;
  }
  .input-map-note b{color:var(--cyan-dark);}
  .slider-group{margin-bottom:10px;}
  .slider-group-label{
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px;
    color:var(--ink-2); margin:0 0 4px 2px;
  }

  /* Panel desagregado del poder */
  .power-panel{margin:12px 0; padding:12px 14px; background:#fff; border:1.5px solid var(--cyan); border-radius:10px; box-shadow:0 2px 10px rgba(0,182,236,0.08);}
  .power-head{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
  .power-title{font-family:var(--display); font-weight:800; font-size:13px; color:var(--ink-0);}
  .power-score{display:flex; align-items:center; gap:10px;}
  .pl-badge{font-family:var(--mono); font-size:11px; font-weight:700; padding:4px 11px; border-radius:20px; color:#fff; white-space:nowrap;}
  .pl-1{background:#8992a3;} .pl-2{background:#5aa9d6;} .pl-3{background:#00b6ec;} .pl-4{background:#6c5ce7;} .pl-5{background:#1a1a1c;}
  .pl-num{font-family:var(--mono); font-size:18px; font-weight:800; color:var(--cyan-dark);}
  .pl-num i{font-style:normal; font-size:11px; color:var(--ink-2); font-weight:600;}
  .power-crit-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:9px 14px;}
  .power-crit-grid .wtag{font-family:var(--mono); font-size:9.5px; font-weight:700; color:#fff; background:var(--cyan); padding:1px 6px; border-radius:10px; margin-left:4px;}
  .power-desc{margin-top:10px; font-size:11.5px; color:var(--ink-1); line-height:1.5; background:var(--cyan-dim); border-radius:8px; padding:7px 11px;}

  /* Panel de interés: mismo patrón que el de poder, con acento cálido (naranja) */
  .interest-panel{border-color:var(--warn); box-shadow:0 2px 10px rgba(255,159,28,0.10);}
  .interest-panel .wtag{background:var(--warn);}
  .il-badge{font-family:var(--mono); font-size:11px; font-weight:700; padding:4px 11px; border-radius:20px; color:#fff; white-space:nowrap;}
  .il-num{font-family:var(--mono); font-size:18px; font-weight:800; color:#b56b00;}
  .il-num i{font-style:normal; font-size:11px; color:var(--ink-2); font-weight:600;}
  .interest-desc{margin-top:10px; font-size:11.5px; color:var(--ink-1); line-height:1.5; background:rgba(255,159,28,0.12); border-radius:8px; padding:7px 11px;}
  .interest-readout{background:rgba(255,159,28,0.12); border-color:rgba(255,159,28,0.35);}
  .interest-readout b{color:#b56b00;}
  .interest-readout .pr-num{color:#b56b00;}

  /* Ponderación (sidebar) */
  .weights{display:flex; flex-direction:column; gap:7px;}
  .wrow{display:flex; align-items:center; gap:8px; justify-content:space-between;}
  .wrow label{font-size:11.5px; color:var(--ink-1); font-weight:600; line-height:1.25;}
  .winp{width:64px; flex-shrink:0; background:var(--bg-2); border:1.5px solid var(--panel-border); border-radius:7px; padding:5px 7px; font-family:var(--mono); font-size:12px; color:var(--ink-0); text-align:right;}
  .winp:focus{outline:none; border-color:var(--cyan); background:#fff;}
  .wsum{margin-top:4px; font-size:12px; color:var(--ink-2); font-family:var(--mono); display:flex; align-items:center;}

  /* Indicador de poder de solo lectura (sidebar de otras vistas) */
  .power-readout{display:flex; justify-content:space-between; align-items:center; gap:8px; background:var(--cyan-dim); border:1px solid rgba(0,182,236,0.3); border-radius:9px; padding:8px 11px; font-size:12px; color:var(--ink-1); margin-bottom:4px;}
  .power-readout b{color:var(--cyan-dark);}
  .pr-num{font-family:var(--mono); font-weight:800; font-size:15px; color:var(--cyan-dark);}
  .pr-num i{font-style:normal; font-size:10px; color:var(--ink-2); font-weight:600;}
  .pr-hint{font-size:10.5px; color:var(--ink-2); margin-bottom:12px; line-height:1.4;}

  /* ===== SIDEBAR ===== */
  .sidebar{
    width:310px;
    flex-shrink:0;
    background:var(--panel);
    border-left:1px solid var(--panel-border);
    overflow-y:auto;
    padding:18px 18px 40px;
  }
  .sidebar h3{
    font-family:var(--display); font-size:13px; font-weight:800;
    color:var(--ink-0); margin:0 0 14px;
    display:flex; align-items:center; gap:8px;
  }
  .sidebar h3::before{content:''; width:4px; height:14px; background:linear-gradient(180deg, var(--cyan), var(--cat-prov)); display:inline-block; border-radius:3px;}
  .sidebar h3.mt{margin-top:22px;}
  .field{margin-bottom:12px;}
  .field label{
    display:block; font-size:10.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.5px; color:var(--ink-2); margin-bottom:5px;
  }
  .field input, .field textarea, .field select{
    width:100%; background:var(--bg-2); border:1.5px solid var(--panel-border);
    border-radius:8px; color:var(--ink-0); padding:7px 9px; font-family:var(--body);
    font-size:13px;
  }
  .field input:focus, .field textarea:focus, .field select:focus{outline:none; border-color:var(--cyan); background:#fff;}
  .field textarea{resize:vertical; min-height:48px;}
  .field-row{display:flex; gap:8px;}
  .field-row .field{flex:1;}

  .slider-field{margin-bottom:10px;}
  .slider-field .lab{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:3px;}
  .slider-field .lab label{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-2); margin:0;}
  .slider-field .lab .val{font-family:var(--mono); font-size:12px; font-weight:700; color:var(--cyan-dark);}
  .slider-field input[type=range]{width:100%; accent-color:var(--cyan); margin:0;}

  .empty-hint{color:var(--ink-2); font-size:12.5px; line-height:1.6; padding:8px 0;}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px;}
  .stat{
    background:linear-gradient(145deg, var(--bg-2), #fff); border:1.5px solid var(--panel-border); border-radius:10px;
    padding:10px 11px;
  }
  .stat .v{font-family:var(--mono); font-size:17px; font-weight:800; color:var(--cyan-dark);}
  .stat .l{font-size:9.5px; color:var(--ink-2); font-weight:600; text-transform:uppercase; letter-spacing:0.4px; margin-top:2px;}

  .legend{display:flex; flex-direction:column; gap:6px; margin-bottom:16px;}
  .legend-item{display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--ink-1); font-weight:500;}
  .legend-dot{width:11px;height:11px;border-radius:50%; flex-shrink:0;}

  .tip-box{
    background:var(--cyan-dim); border:1px solid rgba(0,182,236,0.25);
    border-radius:9px; padding:10px 12px; font-size:11.5px; color:var(--ink-1);
    line-height:1.55; margin-bottom:10px;
  }
  .tip-box b{color:var(--cyan-dark);}
  .strat-box{
    border:1.5px solid var(--panel-border); border-radius:10px; padding:10px 12px; margin-bottom:8px;
    font-size:12px; color:var(--ink-1); line-height:1.5;
    background:#fff;
  }
  .strat-box .st{font-family:var(--display); font-weight:800; font-size:12.5px; color:var(--ink-0); margin-bottom:2px; display:flex; align-items:center; gap:7px;}
  .strat-box .st .d{width:11px;height:11px;border-radius:3px;}
  .danger-zone{margin-top:16px; padding-top:14px; border-top:1px dashed var(--panel-border);}


  /* ===== FOOTER STATUS ===== */
  .statusbar{
    border-top:1px solid var(--panel-border);
    background:var(--bg-1);
    padding:7px 22px;
    font-size:11px;
    color:var(--ink-2);
    display:flex; justify-content:space-between;
    font-family:var(--mono);
  }

  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg-0);}
  ::-webkit-scrollbar-thumb{background:#c7d3de; border-radius:5px; border:2px solid var(--bg-0);}
  ::-webkit-scrollbar-thumb:hover{background:var(--cyan);}


  /* ===== REPORTE IMPRIMIBLE (📄) ===== */
  #gpiReport{display:none; font-family:var(--body); color:#1a2027; font-size:11.5px; line-height:1.5; background:#fff;}
  @media print{
    body.report-mode{display:block; background:#fff !important;}
    body.report-mode > *:not(#gpiReport){display:none !important;}
    body.report-mode #gpiReport{display:block !important;}
  }
  #gpiReport .rep-head{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; border-bottom:3px solid #00b6ec; padding-bottom:10px; margin-bottom:14px;}
  #gpiReport .rep-head h1{font-family:var(--display); font-size:19px; margin:0 0 3px; font-weight:800; color:#1a1a1c;}
  #gpiReport .rep-head .sub{font-size:11.5px; color:#4d5768; font-weight:600;}
  #gpiReport .rep-meta{font-family:var(--mono); font-size:10px; color:#4d5768; text-align:right; white-space:nowrap; line-height:1.7;}
  #gpiReport h2{font-family:var(--display); font-size:13px; font-weight:800; margin:16px 0 6px; padding-bottom:3px; border-bottom:1px solid #e0e8f0; break-after:avoid;}
  #gpiReport table{width:100%; border-collapse:collapse; margin:6px 0 10px; font-size:10.5px;}
  #gpiReport th{background:#f3f8fc; text-align:left; font-weight:700; padding:5px 7px; border:1px solid #d5dee8;}
  #gpiReport td{padding:4px 7px; border:1px solid #d5dee8; vertical-align:top;}
  #gpiReport tr{break-inside:avoid;}
  #gpiReport table.rep-kv td:first-child{width:30%; background:#f8fbfe; font-weight:700;}
  #gpiReport ul{margin:4px 0 10px; padding-left:18px;}
  #gpiReport li{margin:2px 0;}
  #gpiReport p{margin:4px 0 10px;}
  #gpiReport .rep-note{color:#4d5768; font-size:10px; margin:2px 0 8px;}
  #gpiReport .num{font-family:var(--mono);}
  #gpiReport .rep-sign{display:grid; grid-template-columns:1fr 1fr; gap:40px; margin-top:46px;}
  #gpiReport .rep-sign .box{border-top:1.5px solid #1a2027; padding-top:6px; font-size:10.5px; text-align:center; color:#1a2027;}

  @media print{

    .chart-wrap{box-shadow:none; border:1px solid #ccc;}
  }
