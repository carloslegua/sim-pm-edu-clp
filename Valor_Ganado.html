<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valor Ganado (EVM) — PMBOK y AACE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#eef4f9; --bg-1:#ffffff; --bg-2:#f3f8fc;
    --panel:#ffffff; --panel-border:#e0e8f0;
    --ink-0:#1a2027; --ink-1:#4d5768; --ink-2:#5b6472;
    --cyan:#00b6ec; --cyan-dark:#0090c2; --black:#1a1a1c;
    --violet:#6c5ce7; --danger:#ff5470; --good:#00c2a8; --warn:#ff9f1c;
    --mono:'JetBrains Mono',monospace; --display:'Manrope',sans-serif; --body:'Manrope','Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; background:radial-gradient(circle, rgba(0,182,236,0.06) 1px, transparent 1px) 0 0/26px 26px, var(--bg-0); color:var(--ink-0); font-family:var(--body); display:flex; flex-direction:column; min-height:100vh;}

  header{border-bottom:1px solid var(--panel-border); background:linear-gradient(180deg,#fff,#fbfdff); padding:12px 22px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; position:relative;}
  header::after{content:''; position:absolute; left:0; right:0; bottom:-1px; height:3px; background:linear-gradient(90deg, var(--cyan), var(--violet) 45%, var(--warn) 75%, #ff6b8b);}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand .logo{width:34px; height:34px; border-radius:9px; flex-shrink:0; background:linear-gradient(135deg,var(--cyan),var(--cyan-dark)); display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,182,236,.35);}
  .brand h1{font-family:var(--display); font-size:19px; font-weight:800; margin:0; color:var(--black);}
  .brand .tag{font-family:var(--mono); font-size:11px; font-weight:600; color:#fff; background:linear-gradient(135deg,var(--cyan),var(--cyan-dark)); padding:3px 9px; border-radius:20px;}
  .brand .sub{font-size:12px; color:var(--ink-2); font-weight:500;}
  .project-title-input{background:transparent; border:none; border-bottom:1px dashed transparent; color:var(--ink-0); font-family:var(--display); font-weight:600; font-size:13px; padding:2px 0; max-width:280px;}
  .project-title-input:hover,.project-title-input:focus{border-bottom:1px dashed var(--cyan); outline:none;}
  .course-title-input{background:transparent; border:none; border-bottom:1px dashed transparent; color:var(--ink-2); font-family:var(--body); font-weight:600; font-size:12px; text-align:right; padding:2px 0; min-width:220px; max-width:320px;}
  .course-title-input:hover,.course-title-input:focus{border-bottom:1px dashed var(--cyan); outline:none; color:var(--ink-0);}

  .toolbar{display:flex; gap:6px; flex-wrap:wrap; align-items:center; padding:10px 22px; background:var(--bg-1); border-bottom:1px solid var(--panel-border);}
  .btn{font-family:var(--body); font-size:12.5px; font-weight:600; color:var(--ink-1); background:var(--bg-2); border:1px solid var(--panel-border); padding:7px 13px; border-radius:8px; cursor:pointer; display:flex; align-items:center; gap:6px; white-space:nowrap; transition:border-color .12s,color .12s,background .12s;}
  .btn:hover{border-color:var(--cyan); color:var(--cyan-dark); background:#fff;}
  .btn.primary{background:linear-gradient(135deg,var(--cyan),var(--cyan-dark)); border-color:transparent; color:#fff;}
  .btn.primary:hover{filter:brightness(1.06); color:#fff;}
  .btn.danger{color:var(--danger);} .btn:disabled{opacity:.35; cursor:not-allowed;}
  .sep{width:1px; height:22px; background:var(--panel-border); margin:0 4px;}
  .tb-field{display:flex; align-items:center; gap:7px; font-size:12px; font-weight:700; color:var(--ink-1);}
  .tb-field input{font-family:var(--mono); font-size:12.5px; padding:6px 8px; border:1px solid var(--panel-border); border-radius:7px; background:#fff;}

  .main-area{flex:1; padding:26px 30px 60px;}
  .view-head h2{font-family:var(--display); font-size:20px; font-weight:800; margin:0 0 4px;}
  .view-head p{font-size:13px; color:var(--ink-1); margin:0 0 16px; max-width:820px; line-height:1.55;}
  .muted{color:var(--ink-2);} .small{font-size:11.5px;} .mono{font-family:var(--mono);}

  .card{background:var(--panel); border:1px solid var(--panel-border); border-radius:14px; padding:14px 16px; margin-bottom:14px; overflow-x:auto;}
  .card h3{font-family:var(--display); font-size:14px; margin:0 0 8px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;} @media(max-width:1100px){.grid2{grid-template-columns:1fr;}}
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(172px,1fr)); gap:10px; margin-bottom:14px;}
  .kpi{background:var(--panel); border:1px solid var(--panel-border); border-radius:12px; padding:10px 12px; border-left-width:5px; border-left-color:#b6bfc9;}
  .kpi.verde{border-left-color:var(--good);} .kpi.ambar{border-left-color:var(--warn);} .kpi.rojo{border-left-color:var(--danger);}
  .kpi .v{font-family:var(--mono); font-size:18px; font-weight:800; white-space:nowrap;} .kpi .l{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-1);} .kpi .s{font-size:11px; color:var(--ink-2);}
  table.an{border-collapse:collapse; width:100%; font-size:12px;}
  table.an th{font-family:var(--mono); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-2); padding:6px; border-bottom:2px solid var(--panel-border); text-align:right; white-space:nowrap;} table.an th.l{text-align:left;}
  table.an td{padding:6px; border-bottom:1px solid var(--panel-border); vertical-align:middle;}
  table.an td.num{text-align:right; font-family:var(--mono); white-space:nowrap;}
  table.an tr.tot td{font-weight:800; background:#f4f9fc;}
  table.an input.in{font-family:var(--mono); font-size:12px; padding:4px 6px; border:1px solid var(--panel-border); border-radius:6px; width:88px; text-align:right;}
  table.an select.in{font-family:var(--body); font-size:11.5px; padding:4px 5px; border:1px solid var(--panel-border); border-radius:6px; max-width:150px;}
  .pill{font-family:var(--mono); font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:12px; white-space:nowrap;}
  .pill.verde{background:rgba(0,194,168,.14); color:#00806d;} .pill.ambar{background:rgba(255,159,28,.18); color:#a05a00;} .pill.rojo{background:rgba(255,84,112,.12); color:#c0203c;}
  .neg{color:#c0203c;} .pos{color:#00806d;}
  .note-box{background:#f4fafd; border:1px dashed var(--cyan); border-radius:10px; padding:10px 12px; font-size:12px; line-height:1.55; color:var(--ink-1); margin-top:10px;}
  .warn-box{background:#fff8ea; border:1px solid #ffd58a; border-radius:10px; padding:9px 12px; font-size:12px; line-height:1.55; color:#6b4a00; margin-top:10px;}
  .empty-hint{background:#f4fafd; border:1px dashed var(--cyan); border-radius:12px; padding:22px; color:var(--ink-1); font-size:13px; line-height:1.6;}
  svg.scurve{width:100%; height:auto; max-width:760px;}
  .lg{display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--ink-1); font-family:var(--mono); margin-top:4px;} .lg i{display:inline-block; width:14px; height:3px; margin-right:5px; vertical-align:middle;}

  .banner{display:none; background:#fff3d6; border-bottom:1px solid #ffd58a; color:#6b4a00; padding:9px 22px; font-size:12.5px;} .banner.show{display:block;}
  .statusbar{border-top:1px solid var(--panel-border); background:var(--bg-1); padding:7px 22px; font-size:11px; color:var(--ink-2); display:flex; justify-content:space-between; font-family:var(--mono);}
  @page{margin:15mm 13mm;}
  @media print{ .toolbar,.statusbar,.gpi-badge{display:none !important;} body{background:#fff !important;} }
</style>
<link rel="stylesheet" href="gpi-shared.css">
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 20h18" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><path d="M4 16 9 11l4 3 7-8" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div>
      <h1>Valor Ganado (EVM) <span class="tag">PMBOK · AACE</span></h1>
      <div class="sub"><input class="project-title-input" id="projectTitle" value="Proyecto DISTRIB+ S.A. — Almacén Lurín" aria-label="Nombre del proyecto"></div>
    </div>
  </div>
  <input class="course-title-input" id="courseTitle" value="Gestión de Proyectos de Ingeniería" aria-label="Curso">
</header>

<div class="banner" id="banner" role="alert"></div>

<div class="toolbar">
  <label class="tb-field">Fecha de corte <input type="date" id="statusDate"></label>
  <button class="btn primary" id="btnRegister" title="Guarda el corte actual (PV, EV, AC) en el historial y en la curva S">✚ Registrar corte</button>
  <button class="btn" id="btnPull" title="Trae el % de avance de cada paquete desde WBS Builder (si lo tiene)">↧ Traer avance de la EDT</button>
  <div class="sep"></div>
  <button class="btn" id="btnExportCsv">⭳ CSV</button>
  <button class="btn" id="btnPrint">🖨 Imprimir / PDF</button>
  <div class="sep"></div>
  <button class="btn" id="btnSample">Cargar ejemplo</button>
  <button class="btn danger" id="btnReset">Nuevo seguimiento</button>
</div>

<div class="main-area" id="mainArea"></div>

<div class="statusbar">
  <span id="statusLeft">Listo</span>
  <span>PV sobre la línea base del cronograma · EV con técnica por paquete · cronograma ganado (Earned Schedule)</span>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle">Confirmar</h3>
    <p id="modalMessage"></p>
    <div class="modal-actions">
      <button class="btn" id="modalCancelBtn">Cancelar</button>
      <button class="btn danger" id="modalConfirmBtn">Aceptar</button>
    </div>
  </div>
</div>

<script src="gpi-core.js"></script>
<script src="evm.js"></script>
</body>
</html>
